<!DOCTYPE html>
<html lang="id" data-tema="terang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artikel — {nama}</title>
<meta name="description" content="Laporan dan kabar terbaru dari pesantren.">
<meta name="theme-color" content="#047857">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕌</text></svg>">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<header id="navbar"></header>

<main id="utama">

  <div class="wadah">
    <nav class="remah" id="remah" aria-label="Jejak navigasi"></nav>
  </div>

  <section class="bagian" style="padding-top:var(--s-lg)">

      <div class="berita-kisi">
        <article class="lajur" style="gap:var(--s-lg);min-width:0" id="artikel">
          <div class="rangka" style="height:40px;width:70%"></div>
          <div class="rangka" style="aspect-ratio:16/9;border-radius:2rem"></div>
        </article>
        <aside class="sidebar" id="sidebar"></aside>
      </div>
    </div>
  </section>

</main>

<footer id="footer"></footer>
<div id="toast-wadah"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
