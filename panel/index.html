<!DOCTYPE html>
<html lang="id" data-tema="terang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Pengelola — Portal Donasi</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#047857">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕌</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="panel.css">
</head>

<body class="panel-body">

<!-- ======================================================= LAYAR MASUK -->
<div id="layar-masuk" class="masuk-layar" hidden>
  <div class="masuk-latar" aria-hidden="true">
    <span class="masuk-cahaya masuk-cahaya-1"></span>
    <span class="masuk-cahaya masuk-cahaya-2"></span>
  </div>

  <div class="masuk-kartu kaca">
    <div class="masuk-kepala">
      <span class="masuk-lambang" id="masuk-lambang"></span>
      <h1 id="masuk-judul">Panel Pengelola</h1>
      <p class="redup kecil" id="masuk-sub">Portal Donasi Pondok Pesantren</p>
    </div>

    <form id="form-masuk" novalidate>
      <div class="bidang">
        <label for="m-username">Nama pengguna</label>
        <input type="text" id="m-username" name="username" autocomplete="username"
               placeholder="admin" required autocapitalize="none" spellcheck="false">
      </div>

      <div class="bidang">
        <label for="m-sandi">Kata sandi</label>
        <div class="bidang-gabung">
          <input type="password" id="m-sandi" name="password" autocomplete="current-password"
                 placeholder="••••••••••" required>
          <button type="button" class="tombol-bulat" id="m-lihat" aria-label="Tampilkan kata sandi"></button>
        </div>
      </div>

      <div class="pesan pesan-galat" id="m-galat" hidden></div>

      <button type="submit" class="tombol tombol-primer tombol-penuh" id="m-kirim">Masuk ke Panel</button>
    </form>

    <div class="masuk-kaki">
      <p class="mini redup" id="masuk-catatan"></p>
      <a class="mini" href="../index.html">← Kembali ke situs publik</a>
    </div>
  </div>
</div>

<!-- ====================================================== KERANGKA PANEL -->
<div id="kerangka" class="panel-kerangka" hidden>

  <aside class="sisi" id="sisi">
    <div class="sisi-kepala">
      <span class="sisi-lambang" id="sisi-lambang"></span>
      <span class="lajur" style="min-width:0">
        <b id="sisi-nama">Portal Donasi</b>
        <span class="mini redup">Panel Pengelola</span>
      </span>
      <button type="button" class="tombol-bulat hanya-hp" id="sisi-tutup" aria-label="Tutup menu"></button>
    </div>

    <nav class="sisi-menu" id="sisi-menu" aria-label="Menu panel"></nav>

    <div class="sisi-kaki">
      <div class="baris" style="gap:.6rem">
        <span class="avatar" id="aku-avatar">?</span>
        <span class="lajur tumbuh" style="min-width:0">
          <b class="kecil" id="aku-nama">—</b>
          <span class="mini redup" id="aku-peran">—</span>
        </span>
      </div>
      <button type="button" class="tombol tombol-lembut tombol-penuh tombol-kecil" id="tombol-keluar">Keluar</button>
    </div>
  </aside>

  <div class="tirai" id="tirai" hidden></div>

  <div class="utama">
    <header class="bar">
      <button type="button" class="tombol-bulat hanya-hp" id="sisi-buka" aria-label="Buka menu"></button>
      <div class="lajur tumbuh" style="min-width:0">
        <h1 id="bar-judul">Dasbor</h1>
        <p class="mini redup" id="bar-sub"></p>
      </div>
      <button type="button" class="tombol-bulat" id="tombol-segar" aria-label="Muat ulang data"></button>
      <button type="button" class="tombol-bulat" id="tombol-tema" aria-label="Ganti tema"></button>
      <a class="tombol-bulat" href="../index.html" target="_blank" rel="noopener" aria-label="Lihat situs publik" id="tombol-situs"></a>
    </header>

    <main id="isi" class="isi" tabindex="-1"></main>
  </div>
</div>

<div id="toast-wadah"></div>
<div id="modal-wadah"></div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="js/inti.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/donasi.js"></script>
<script src="js/program.js"></script>
<script src="js/konten.js"></script>
<script src="js/crm.js"></script>
<script src="js/sistem.js"></script>
<script src="js/mulai.js"></script>
</body>
</html>
